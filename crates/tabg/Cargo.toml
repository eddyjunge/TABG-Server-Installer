[package]
name = "tabg"
description = "Host Totally Accurate Battlegrounds servers for your friends"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tabg-host = { path = "../tabg-host" }
tabg-web = { path = "../tabg-web" }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
ureq = { version = "3.5.1", features = ["json"] }

[lints]
workspace = true
