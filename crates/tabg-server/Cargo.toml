[package]
name = "tabg-server"
description = "The tabg game server: runs a TABG room over ENet"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
tabg-game = { path = "../tabg-game" }
tabg-net = { path = "../tabg-net" }
tabg-protocol = { path = "../tabg-protocol" }
clap = { version = "4.5", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tabg-probe = { path = "../tabg-probe" }

[lints]
workspace = true
