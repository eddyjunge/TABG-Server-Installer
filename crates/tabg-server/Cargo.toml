[package]
name = "tabg-server"
description = "The tabg game server: runs a TABG room over ENet or Unity Relay"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
tabg-game = { path = "../tabg-game" }
tabg-net = { path = "../tabg-net" }
tabg-protocol = { path = "../tabg-protocol" }
tabg-utp = { path = "../tabg-utp" }
tabg-world = { path = "../tabg-world" }
clap = { version = "4.5", features = ["derive", "env"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ureq = { version = "3.5.1", features = ["json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
igd-next = "0.17.1"
ctrlc = "3.5.2"

[dev-dependencies]
tabg-probe = { path = "../tabg-probe" }

[lints]
workspace = true
