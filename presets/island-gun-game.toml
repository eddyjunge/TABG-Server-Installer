title = "Island Gun Game"
description = "Gun Game on the hidden DevTest island. Friends need the dev-test-map mod (included in the share code)."

[config.game]
mode = "test"
map = "dev_test"
teams = "solo"
players_to_start = 2
countdown = 5
loot_amount = 0

[config.rules]
respawn = true
respawn_delay = 3
kills_to_win = 0
time_limit = 1200
gun_game = [
  [{ item = 273, qty = 1 }],   # Hand Gun
  [{ item = 277, qty = 1 }],   # m1911
  [{ item = 266, qty = 1 }],   # Desert Eagle
  [{ item = 308, qty = 1 }],   # Mac-10
  [{ item = 310, qty = 1 }],   # MP5-K
  [{ item = 297, qty = 1 }],   # Mossberg-500
  [{ item = 152, qty = 1 }],   # AK-47
  [{ item = 160, qty = 1 }],   # M16
  [{ item = 321, qty = 1 }],   # Kar98K
  [{ item = 254, qty = 1 }],   # Katana
]

[config.mods]
client = ["dev-test-map"]

[config]
loadout = [
  { item = 6, qty = 240 },
  { item = 9, qty = 240 },
  { item = 1, qty = 120 },
  { item = 8, qty = 60 },
]
