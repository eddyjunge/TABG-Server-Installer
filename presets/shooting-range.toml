title = "Shooting Range"
description = "TABG's WilhelmTest range: F6 opens a menu with every item, and you respawn after 3 s. Friends need the range-map mod (included in the share code)."

[config.game]
mode = "test"
map = "range"
teams = "solo"
players_to_start = 1
countdown = 3
loot_amount = 0

[config.rules]
respawn = true
respawn_delay = 3
kills_to_win = 0
time_limit = 0
gun_game = []

[config.mods]
client = ["range-map"]

[config]
loadout = [{ item = 160, qty = 1 }, { item = 6, qty = 240 }]   # M16 and ammo; F6 has everything else
